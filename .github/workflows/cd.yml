name: CD

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine service and environment
        id: vars
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" || "${{ github.ref_name }}" == "develop" ]]; then
            echo "service_id=${{ secrets.RENDER_SERVICE_ID_STAGING }}" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "Branch not configured for deploy"
            exit 1
          fi
      - name: Deploy to Render
        uses: render-oss/render-deploy-action@v1
        with:
          service-id: ${{ steps.vars.outputs.service_id }}
          api-key: ${{ secrets.RENDER_API_KEY }}
